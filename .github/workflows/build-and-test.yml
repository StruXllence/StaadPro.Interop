name: Build and Test Core

on:
  push:
    branches: [ staadpro-interop-core ]
  pull_request:
    branches: [ staadpro-interop-core ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore Dependencies
      run: dotnet restore StaadPro.Interop.Core.sln
    - name: Build Core Solution
      run: dotnet build StaadPro.Interop.Core.sln -c Release --no-restore
    - name: Run Offline Tests
      run: dotnet test tests/StaadPro.Interop.Core.Tests/StaadPro.Interop.Core.Tests.csproj -c Release --no-build --filter "TestCategory!=LiveIntegration"
    - name: Pack Core Preview
      run: dotnet pack src/StaadPro.Interop.Core/StaadPro.Interop.Core.csproj -c Release --no-build -p:PackageVersion=1.0.0-preview.ci.${{ github.run_number }} -o artifacts/package
    - name: Verify Core Package and IntelliSense
      shell: pwsh
      run: ./eng/Verify-CorePackage.ps1 -PackagePath artifacts/package/StaadPro.Interop.Core.1.0.0-preview.ci.${{ github.run_number }}.nupkg
